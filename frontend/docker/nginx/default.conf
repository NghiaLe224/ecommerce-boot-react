server {
    listen 80;
    server_name _;

    # Serve built static files
    root /usr/share/nginx/html;
    index index.html;

    # Try files, then fallback to index.html (for SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Spring Boot service inside the compose network
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # If your backend exposes public endpoints without /api prefix, add them too
    location /public/ {
        proxy_pass http://backend:8080/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: proxy Swagger UI if you need it through the same origin
    # location /swagger-ui/ {
    #     proxy_pass http://backend:8080/swagger-ui/;
    # }
}
