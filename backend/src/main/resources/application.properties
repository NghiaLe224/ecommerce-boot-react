spring.application.name=sb-ecom
spring.main.banner-mode=off


spring.datasource.url=jdbc:mysql://localhost:3306/ecom
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.path=uploads/images

# VNPay Config
vnpay.tmn-code=FF1XP02R
vnpay.hash-secret=WAAKUJL0WSGGBHOAOWQ0GJI8A0ZJEF4B
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/payments/vnpay-return
vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

# CORS (config front-end)
app.security.cors.allowed-origins=http://localhost:5173
app.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.security.cors.allowed-headers=Authorization,Cache-Control,Content-Type
app.security.cors.allow-credentials=true

app.frontend.base-url=http://localhost:5173

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=900
app.jwt.refresh-token-ttl=1209600
app.jwt.issuer=fortune

# Cookie cho refresh token
app.jwt.refresh-cookie-name=refresh-token
#app.jwt.refresh-cookie-domain=fortune-shop.com
app.jwt.refresh-cookie-domain=localhost
app.jwt.refresh-cookie-secure=false
app.jwt.refresh-cookie-same-site=none
app.jwt.refresh-cookie-path=/api/auth/refresh

cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=ap-southeast-1
cloud.aws.bucket.name=ecomsb-prod

